name: Collect TX night-session snapshot

# Runs every 30 minutes through the TAIFEX night session (盤後/夜盤).
# 15:00-05:00 Taipei time == 07:00-21:00 UTC on the SAME UTC calendar day
on:
  schedule:
    - cron: "*/30 7-20 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  collect:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: python -m pip install -r requirements.txt

      - name: Take one snapshot
        run: python scripts/tx_night_session.py collect --data-dir data/night_session

      - name: Commit snapshot
        run: |
          git config user.name "premarket-intel-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/night_session/
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "night session snapshot $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push; then
              exit 0
            fi
            git rebase --abort || true
            echo "push attempt ${attempt} failed; retrying" >&2
            sleep $((attempt * 5))
          done
          echo "Unable to push night-session snapshot after 3 attempts" >&2
          exit 1

  notify-failure:
    needs: [collect]
    if: >-
      always() &&
      (needs.collect.result == 'failure' || needs.collect.result == 'cancelled')
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Send Failure Notification Webhook
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ERROR_WEBHOOK_URL: ${{ secrets.ERROR_WEBHOOK_URL }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          FAILED_JOBS: collect=${{ needs.collect.result }}
        run: python scripts/notify_summary.py --mode failure
