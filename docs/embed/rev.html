    <script>
      (function(){
        function applyTheme(theme) {
          if (!theme) {
            try {
              var p = new URLSearchParams(location.search);
              theme = p.get('theme');
            } catch(e){}
            if (!theme) {
              try {
                theme = window.parent.document.documentElement.getAttribute('data-theme');
              } catch(e){}
            }
            if (!theme) {
              try {
                theme = localStorage.getItem('premarket.theme');
              } catch(e){}
            }
          }
          var isDark = (theme !== 'light');
          var mode = isDark ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', mode);
          document.documentElement.className = mode;
          if (document.body) {
            document.body.className = mode;
            document.body.setAttribute('data-theme', mode);
          }
        }
        window.addEventListener('message', function(e) {
          if (e.data && e.data.type === 'theme-change') {
            applyTheme(e.data.theme);
          }
          if (e.data && e.data.type === 'request-height') {
            send();
          }
        });
        function send(){
          try {
            var app = document.getElementById('app');
            var tbl = app ? app.querySelector('table') : null;
            var filter = app ? app.querySelector('.filter-bar') : null;
            var totalH = 0;
            if (tbl) {
              totalH = (filter ? filter.offsetHeight + 10 : 0) + tbl.offsetHeight + 24;
            } else if (app) {
              totalH = app.scrollHeight + 16;
            } else {
              totalH = document.body.scrollHeight + 16;
            }
            var finalH = Math.max(120, Math.ceil(totalH));
            parent.postMessage({type:'embed-height', id: location.pathname.split('/').pop().replace('.html',''), height: finalH}, '*');
          } catch(e){}
        }

        // MutationObserver to catch when tables render, filters change, or details expand
        var mo = new MutationObserver(function() {
          send();
        });
        document.addEventListener('DOMContentLoaded', function() {
          applyTheme();
          send();
          if (document.body) mo.observe(document.body, { childList: true, subtree: true, attributes: true });
        });
        window.addEventListener('load', function() {
          applyTheme();
          send();
        });
        setTimeout(function() {
          var app = document.getElementById('app');
          if (app && app.innerHTML.indexOf('載入中') >= 0) {
            app.innerHTML = '<div class="empty">⚠️ 資料連線逾時（已沿用 build-time 快照）</div>';
            send();
          }
        }, 3500);
        setTimeout(function() { applyTheme(); send(); }, 100);
        setTimeout(function() { applyTheme(); send(); }, 300);
        setTimeout(function() { applyTheme(); send(); }, 800);
        setTimeout(function() { applyTheme(); send(); }, 1500);
      })();
    </script>

<script>
var JSON_URL = 'https://chengwaye-data.pages.dev/realtime_revenue.json';
// 封存期別（2026-07-11）：換月後上一期整包封存於 realtime_revenue_YYYYMM.json，不再消失
var PERIODS_URL = 'https://chengwaye-data.pages.dev/realtime_revenue_periods.json';
var ARCHIVE_BASE = 'https://chengwaye-data.pages.dev/realtime_revenue_';
var REALTIME_DATA_FETCH_TIMEOUT_MS = 12000;
var VIEW_PERIOD = ''; // ''=本期；'YYYY/MM'=檢視封存期
var DATA = null, FILTERED = [], SORT_KEY = 'first_seen', SORT_DESC = true, SEARCH_CODE = '';
var yoyDir = '>', momDir = '>';
var lastHash = '', _firstLoad = true;

async function fetchJsonWithTimeout(url, timeoutMs) {
  var controller = new AbortController();
  var timer = setTimeout(function() { controller.abort(); }, timeoutMs);
  try {
    var response = await fetch(url, { signal: controller.signal });
    if (!response || !response.ok) throw new Error('fetch failed');
    return await response.json();
  } finally {
    clearTimeout(timer);
  }
}

function esc(s) { return s ? s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') : ''; }
function fmtRev(v) { if (v == null) return '\u2014'; return (v/1000).toLocaleString('zh-TW',{minimumFractionDigits:1,maximumFractionDigits:1}); }
function fmtPct(v) { if (v == null) return '\u2014'; return Number(v).toFixed(2)+'%'; }
function pctColor(n) { return n > 0 ? '#f85149' : n < 0 ? '#3fb950' : '#888'; }
function pctStyle(v) { var n=Number(v); if(isNaN(n)) return 'color:#888;'; return 'color:'+pctColor(n)+';'; }
function aiScoreColor(s) {
  if (s == null) return '#444';
  var n = Math.abs(s);
  if (n >= 8) return s > 0 ? '#ff4444' : '#00cc66';
  if (n >= 6) return s > 0 ? '#f0883e' : '#3fb950';
  if (n >= 4) return s > 0 ? '#d29922' : '#7ee787';
  if (n >= 1) return '#888';
  return '#444';
}
function fmtAiScore(e) {
  var s = e.ai_score;
  if (s == null) return '<span class="ai-score" style="color:#333;">—</span>';
  var c = aiScoreColor(s);
  var tip = e.ai_reason ? ' data-tip="' + esc(e.ai_reason) + '"' : '';
  var cls = e.ai_reason ? ' info-i' : '';
  return '<span class="ai-score' + cls + '" style="color:' + c + ';"' + tip + '>' + (s > 0 ? '+' : '') + s + '</span>';
}

function searchStock(v) { SEARCH_CODE = (v||'').trim(); applyFilter(); }

function toggleDir(type) {
  if (type === 'yoy') {
    yoyDir = yoyDir === '>' ? '<' : '>';
    document.getElementById('yoy-dir').textContent = yoyDir;
  } else {
    momDir = momDir === '>' ? '<' : '>';
    document.getElementById('mom-dir').textContent = momDir;
  }
  applyFilter();
}

function applyFilter() {
  if (!DATA || !DATA.entries) return;
  var yoyOn = document.getElementById('f-yoy-on').checked;
  var momOn = document.getElementById('f-mom-on').checked;
  var yoyVal = parseFloat(document.getElementById('f-yoy-val').value);
  var momVal = parseFloat(document.getElementById('f-mom-val').value);
  var fNew = document.getElementById('f-new').checked;
  var fAi = document.getElementById('f-ai').checked;

  FILTERED = DATA.entries.filter(function(e) {
    if (SEARCH_CODE && e.code.indexOf(SEARCH_CODE) !== 0) return false;
    if (fNew && !(e.first_seen && e.first_seen > getCutoffTime())) return false;
    if (fAi && e.ai_score == null) return false;
    if (yoyOn && !isNaN(yoyVal) && e.yoy_pct != null) {
      if (yoyDir === '>' && e.yoy_pct <= yoyVal) return false;
      if (yoyDir === '<' && e.yoy_pct >= yoyVal) return false;
    }
    if (momOn && !isNaN(momVal) && e.mom_pct != null) {
      if (momDir === '>' && e.mom_pct <= momVal) return false;
      if (momDir === '<' && e.mom_pct >= momVal) return false;
    }
    return true;
  });
  sortData(); renderTable();
}

function sortData() {
  var k=SORT_KEY, d=SORT_DESC;
  FILTERED.sort(function(a,b) {
    var va=a[k],vb=b[k];
    if(va==null) va=d?-Infinity:Infinity; if(vb==null) vb=d?-Infinity:Infinity;
    if(typeof va==='string') return d?vb.localeCompare(va):va.localeCompare(vb);
    return d?vb-va:va-vb;
  });
}

function doSort(k) { if(SORT_KEY===k) SORT_DESC=!SORT_DESC; else { SORT_KEY=k; SORT_DESC=true; } sortData(); renderTable(); }
function sortArrow(k) { return SORT_KEY!==k ? '<span class="sort-arrow">\u25B2</span>' : '<span class="sort-arrow active">'+(SORT_DESC?'\u25BC':'\u25B2')+'</span>'; }

// HOLIDAYS, isTradingDay, getCutoffString 由 shared-utils.js 提供
function getCutoffTime() { return getCutoffString(); }

function buildHistoryHTML(hist, curRev, curPeriod, prevRev) {
  // 按時間正序（舊→新，直方圖左到右）
  var sorted = (hist || []).slice().sort(function(a,b){ return (a.year*100+a.month)-(b.year*100+b.month); });
  var cy = null, cm = null;
  if (curPeriod) {
    var parts = curPeriod.split('/');
    cy = parseInt(parts[0], 10);
    cm = parseInt(parts[1], 10);
  }
  function hasMonth(year, month) {
    return sorted.some(function(r){ return r.year === year && r.month === month; });
  }
  function addMonth(year, month, rev) {
    var n = Number(rev);
    if (!year || !month || !isFinite(n) || hasMonth(year, month)) return;
    sorted.push({year: year, month: month, rev: n});
  }
  if (cy && cm) {
    var py = cy, pm = cm - 1;
    if (pm < 1) { pm = 12; py -= 1; }
    // MOPS 本期列有「上月營收」；FinMind 歷史檔偶爾尚未更新，先補前一月避免圖表斷格。
    addMonth(py, pm, prevRev);
    // 把最新公佈的當月營收加到最後
    addMonth(cy, cm, curRev);
    sorted.sort(function(a,b){ return (a.year*100+a.month)-(b.year*100+b.month); });
  }
  if (!sorted.length) return '<div class="hist-wrap" style="color:#555;font-size:12px;">無歷史資料</div>';
  var maxRev = 0;
  sorted.forEach(function(r){ if(r.rev > maxRev) maxRev = r.rev; });

  // 直方圖（可水平滾動，每根 bar 40px 寬，預設捲到最右邊）
  var barW = 16, chartH = 90;
  var totalW = sorted.length * barW;
  var uid = 'chart-' + Date.now() + '-' + Math.random().toString(36).substr(2,4);
  var h = '<div class="hist-wrap">';
  h += '<div id="' + uid + '" style="overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;max-width:100%;">';
  h += '<div style="display:flex;align-items:flex-end;height:' + chartH + 'px;min-width:' + totalW + 'px;gap:2px;padding:0 4px;">';
  sorted.forEach(function(r) {
    var pct = maxRev > 0 ? (r.rev / maxRev * 100) : 0;
    var barH = Math.max(2, pct * (chartH - 20) / 100);
    var isLatest = cy && cm && r.year === cy && r.month === cm;
    var c = isLatest ? '#f0883e' : '#30363d';
    var label = r.month === 1 ? r.year : r.month;
    h += '<div style="display:flex;flex-direction:column;align-items:center;min-width:' + (barW-2) + 'px;">';
    h += '<div style="width:' + (barW-6) + 'px;height:' + barH + 'px;background:' + c + ';border-radius:2px 2px 0 0;"></div>';
    h += '<div style="font-size:9px;color:' + (isLatest ? '#f0883e' : r.month === 1 ? '#ddd' : '#555') + ';margin-top:2px;' + (r.month === 1 || isLatest ? 'font-weight:700;' : '') + '">' + label + '</div>';
    h += '</div>';
  });
  h += '</div>';  // 關閉 flex 容器
  h += '</div>';  // 關閉滾動容器 (uid)
  // 自動捲到最右（最新月份）
  // scrollLeft 由 toggleHistory 處理（innerHTML 裡的 script 不會執行）

  // 表格（最新在上，預設 12 個月，可展開全部）
  var revSorted = sorted.slice().reverse();
  var showDefault = 12;
  var tblId = 'tbl-' + Date.now() + '-' + Math.random().toString(36).substr(2,4);

  function buildRow(r) {
    var rev = r.rev;
    var prevM = null, prevY = null;
    for (var j = 0; j < sorted.length; j++) {
      var s = sorted[j];
      if (s.year === r.year && s.month === r.month - 1) prevM = s.rev;
      if (r.month === 1 && s.year === r.year - 1 && s.month === 12) prevM = s.rev;
      if (s.year === r.year - 1 && s.month === r.month) prevY = s.rev;
    }
    var mom = prevM ? ((rev - prevM) / prevM * 100) : null;
    var yoy = prevY ? ((rev - prevY) / prevY * 100) : null;
    var rh = '<tr><td>' + r.year + '/' + String(r.month).padStart(2,'0') + '</td>';
    rh += '<td class="num">' + fmtRev(rev) + '</td>';
    rh += '<td class="num" style="' + (mom !== null ? pctStyle(mom, false) : 'color:#555;') + '">' + (mom !== null ? mom.toFixed(1) + '%' : '\u2014') + '</td>';
    rh += '<td class="num" style="' + (yoy !== null ? pctStyle(yoy, true) : 'color:#555;') + '">' + (yoy !== null ? yoy.toFixed(1) + '%' : '\u2014') + '</td>';
    rh += '</tr>';
    return rh;
  }

  h += '<table class="hist-tbl cw-ad-exclude google-anno-skip"><thead><tr><th>年月</th><th class="num">營收(百萬)</th><th class="num">MoM%</th><th class="num">YoY%</th></tr></thead><tbody>';
  for (var i = 0; i < Math.min(showDefault, revSorted.length); i++) {
    h += buildRow(revSorted[i]);
  }
  h += '</tbody>';
  if (revSorted.length > showDefault) {
    h += '<tbody id="' + tblId + '" style="display:none;">';
    for (var i = showDefault; i < revSorted.length; i++) {
      h += buildRow(revSorted[i]);
    }
    h += '</tbody>';
  }
  h += '</table>';
  if (revSorted.length > showDefault) {
    h += '<div style="text-align:center;margin:6px 0;"><button onclick="var el=document.getElementById(\'' + tblId + '\');if(el){el.style.display=el.style.display===\'none\'?\'\':\' none\';this.textContent=el.style.display===\'none\'?\'\u25BC \u986F\u793A\u5168\u90E8 (' + revSorted.length + ' \u7B46)\':\'\u25B2 \u6536\u5408\';}" style="background:none;border:1px solid #30363d;color:#58a6ff;padding:4px 16px;border-radius:8px;font-size:11px;cursor:pointer;">\u25BC \u986F\u793A\u5168\u90E8 (' + revSorted.length + ' \u7B46)</button></div>';
  }

  h += '</div>';  // 關閉 hist-wrap
  return h;
}

var _openHistCode = null;

function toggleHistory(code) {
  // 收合：移除展開行
  var existing = document.getElementById('hist-panel-row');
  if (existing) {
    existing.remove();
    var oldRow = _openHistCode ? document.getElementById('row-' + _openHistCode) : null;
    if (oldRow) oldRow.style.background = '';
    if (_openHistCode === code) { _openHistCode = null; return; }
    _openHistCode = null;
  }

  var entry = null;
  if (DATA && DATA.entries) {
    for (var i = 0; i < DATA.entries.length; i++) {
      if (DATA.entries[i].code === code) { entry = DATA.entries[i]; break; }
    }
  }
  if (!entry) return;
  var row = document.getElementById('row-' + code);
  if (!row) return;

  // 在 row 正下方插入一個 colspan 展開行（不拆 table，欄寬不受影響）
  var colCount = row.querySelectorAll('td').length;
  var tr = document.createElement('tr');
  tr.id = 'hist-panel-row';
  var td = document.createElement('td');
  td.colSpan = colCount;
  td.style.cssText = 'padding:0;border:none;background:#0d1117;max-width:0;';
  td.innerHTML = '<div style="overflow:hidden;"><div style="padding:4px 8px;font-size:12px;font-weight:600;color:#58a6ff;">'
    + esc(entry.code) + ' ' + esc(entry.name) + ' \u6B77\u53F2\u71DF\u6536</div>'
    + buildHistoryHTML(entry.history, entry.rev, entry.period, entry.prev_rev) + '</div>';
  tr.appendChild(td);
  row.parentNode.insertBefore(tr, row.nextSibling);

  _openHistCode = code;
  row.style.background = 'rgba(88,166,255,0.15)';

  setTimeout(function(){
    var scrollBox = tr.querySelector('[id^="chart-"]');
    if (scrollBox) scrollBox.scrollLeft = scrollBox.scrollWidth;
    tr.scrollIntoView({behavior:'smooth', block:'nearest'});
  }, 100);
}

function buildSection(rows, title) {
  if (!rows.length) return '';
  var cols=[{k:'code',l:'代號',c:''},{k:'name',l:'名稱',c:''},{k:'ai_score',l:'AI <span class="info-i" data-tip="AI 營收評分（-9 ~ +9）\n\n由 AI 逐筆獨立判斷，非固定公式。\n同樣的成長率，對不同規模公司會給出不同分數。\n\nAI 評估面向：\n\n① 驚喜度 — 這個數字有多超出預期？\n　· 營收規模越大，同幅度成長越驚人\n　· 低基期灌水的高 YoY 會被識別並扣分\n\n② 延續性 — 成長能撐幾季？\n　· MoM 連續加速 > 單月跳升\n　· 結構性成長 > 週期性 > 一次性認列\n\n③ 資訊品質 — 備註含金量\n　· 具體驅動力（產品/客戶/訂單）加分\n　· 制式公文（「市場需求增加所致」）不加分\n\n+8~9 高度超預期｜+6~7 值得關注\n+4~5 有亮點待觀察｜+1~3 符合預期\n0 無特別資訊｜負分＝衰退警示\n\n📊 AI 參考的資料：\n月營收金額、MoM%、YoY%、累計YoY%、\n公司備註原文、近 6 個月 MoM 趨勢\n\n⚠️ 本評分由 AI 模型自動產生，可能存在誤判。\n僅供參考，不構成任何投資建議或買賣推薦。\n投資人應自行研判並承擔投資風險。\n營收數據來源為公開資訊觀測站，\nAI 評分為模型推論結果，與任何券商或法人觀點無關。" style="color:#6e7681;font-size:10px;cursor:help;">ⓘ</span>',c:'ai-col'},{k:'first_seen',l:'偵測時間 ⓘ',c:'time-col'},{k:'rev',l:'營收(M)',c:'num-col rev-col'},{k:'mom_pct',l:'MoM%',c:'num-col'},{k:'yoy_pct',l:'YoY%',c:'num-col'},{k:'cum_yoy_pct',l:'累計YoY%',c:'num-col'},{k:'note',l:'備註',c:'note-col'}];
  var dotColor = title.indexOf('未反映') >= 0 ? '#f0883e' : '#30363d';
  var parts = ['<div class="date-header"><span class="sd-dot" style="background:', dotColor, '"></span>', esc(title), '<span class="sd-count">(', String(rows.length), ')</span></div>'];
  parts.push('<div class="tbl-wrap cw-ad-exclude google-anno-skip"><table class="revenue-table cw-ad-exclude google-anno-skip"><colgroup><col class="c-code"><col class="c-name"><col class="c-ai"><col class="c-time"><col class="c-rev"><col class="c-pct"><col class="c-pct"><col class="c-cum"><col class="c-note"></colgroup><thead><tr>');
  cols.forEach(function(c){ parts.push('<th class="'+c.c+'" onclick="doSort(\''+c.k+'\')">'+c.l+sortArrow(c.k)+'</th>'); });
  parts.push('</tr></thead><tbody>');
  rows.forEach(function(e){
    var cls = e.is_new ? 'highlight clickable' : 'clickable';
    var hasHist = e.history && e.history.length > 0;
    parts.push('<tr id="row-'+esc(e.code)+'" class="'+cls+'"'+(hasHist?' onclick="toggleHistory(\''+esc(e.code)+'\')"':'')+'>');
    parts.push('<td class="code-col">'+esc(e.code)+'</td>');
    parts.push('<td class="name-col">'+esc(e.name)+(hasHist?' <span style="color:#555;font-size:10px;">\u25BC</span>':'')+'</td>');
    parts.push('<td class="ai-col">'+fmtAiScore(e)+'</td>');
    var fs = e.first_seen||''; var fsShort = fs ? fs.substring(5,16).replace(' ','\u2002') : '\u2014';
    parts.push('<td class="time-col" title="系統每15分鐘偵測MOPS營收頁面，此為首次偵測到該公司申報的時間（誤差\u226415分鐘），非精確公告時間">'+fsShort+'</td>');
    parts.push('<td class="num-col rev-col">'+fmtRev(e.rev)+'</td>');
    parts.push('<td class="num-col" style="'+pctStyle(e.mom_pct,false)+'">'+fmtPct(e.mom_pct)+'</td>');
    parts.push('<td class="num-col" style="'+pctStyle(e.yoy_pct,true)+'">'+fmtPct(e.yoy_pct)+'</td>');
    parts.push('<td class="num-col" style="'+pctStyle(e.cum_yoy_pct,false)+'">'+fmtPct(e.cum_yoy_pct)+'</td>');
    parts.push('<td class="note-col" style="font-size:0.75em;color:#aaa;white-space:normal;max-width:180px;">'+(e.note?esc(e.note):'')+'</td>');
    parts.push('</tr>');
  });
  parts.push('</tbody></table></div>');
  return parts.join('');
}

function renderTable() {
  var app = document.getElementById('app');
  if (!FILTERED.length) { app.textContent = '無符合條件的資料'; app.className = 'empty'; return; }
  app.className = '';
  _openHistCode = null;
  var cutoff = getCutoffTime();
  var unreflected = [], reflected = [];
  FILTERED.forEach(function(e) {
    if (e.first_seen && e.first_seen > cutoff) unreflected.push(e);
    else reflected.push(e);
  });
  var result = '';
  if (unreflected.length) result += buildSection(unreflected, '市場未反映（' + cutoff.substring(5,10) + ' 13:30 後首次偵測）');
  if (false) result += buildSection(reflected, '已反映');
  result += '<div style="text-align:center;margin-top:8px;font-size:11px;color:#555;">\u986F\u793A ' + FILTERED.length + ' \u7B46</div>';
  app.innerHTML = result;
}

function loadData() {
  if (VIEW_PERIOD) return; // 檢視封存期時，不讓自動更新把畫面蓋回本期
  fetchJsonWithTimeout(JSON_URL+'?t='+Date.now(), REALTIME_DATA_FETCH_TIMEOUT_MS).then(function(j){
    var nh=j.fetched_at||''; var isUp=lastHash&&nh!==lastHash; lastHash=nh; DATA=j;
    setPeriodText('營收期間：'+(j.period||'')+' | 已申報 '+(j.total_filed||0)+' 家 ');
    if (j.entries && j.entries.length > 0) {
      applyFilter();
      if (_firstLoad) { _firstLoad = false; }
    } else {

      var app=document.getElementById('app');
      var now2=new Date(), d2=now2.getDate(), cm2=now2.getMonth()+1;
      var rv2=cm2-1||12, nrv2=cm2, ns2=cm2+1>12?1:cm2+1;
      if (d2 >= 1 && d2 <= 12) {
        app.innerHTML='<div class="empty">\u2709 '+rv2+'月營收申報期間（1-10號）<br><span style="font-size:12px;color:#555;">尚無公司申報，系統每15分鐘自動偵測</span></div>';
      } else {
        app.innerHTML='<div class="empty">\u231B '+rv2+'月營收申報已結束<br><span style="font-size:12px;color:#555;">'+nrv2+'月營收將於'+ns2+'/1起陸續公告</span></div>';
      }
    }
    updateRevLastTime(j);
    resetAutoRefresh();
    if(isUp) flashNotify();
  }).catch(function(e){
    var app=document.getElementById('app');
    var now=new Date(), d=now.getDate();
    var curMonth=now.getMonth()+1; // 1-12
    var revMonth=curMonth-1||(12); // 申報的是上個月的營收
    var nextRevMonth=curMonth; // 下期申報的是本月營收，下月初公告
    var nextStart=curMonth+1>12?1:curMonth+1; // 下期公告開始月份
    if (d >= 1 && d <= 12) {
      app.innerHTML='<div class="empty">\u2709 '+revMonth+'月營收申報期間（1-10號）<br><span style="font-size:12px;color:#555;">尚無公司申報，系統每15分鐘自動偵測</span></div>';
    } else {
      app.innerHTML='<div class="empty">\u231B '+revMonth+'月營收申報已結束<br><span style="font-size:12px;color:#555;">'+nextRevMonth+'月營收將於'+nextStart+'/1起陸續公告</span></div>';
    }
  });
}

var _refreshTimer = null;
function resetAutoRefresh() {
  if (_refreshTimer) clearInterval(_refreshTimer);
  _refreshTimer = setInterval(function(){ loadData(); }, 5 * 60 * 1000);
}

// 營收頁的「最新公告」從 JSON entries 的 first_seen 取最新時間
function updateRevLastTime(data) {
  var el = document.getElementById('last-update');
  if (!el) return;
  var entries = data && data.entries ? data.entries : [];
  if (!entries.length) { el.textContent = '尚無申報 · 偵測中 ✓'; return; }
  var latest = entries[0].first_seen || '';
  for (var i = 1; i < entries.length; i++) {
    if ((entries[i].first_seen || '') > latest) latest = entries[i].first_seen;
  }
  el.textContent = '最新申報：' + latest.substring(5) + ' · 偵測中 ✓';
}

function flashNotify() {
  var el=document.getElementById('flash-notification'); el.textContent='資料已更新';
  el.classList.add('show'); setTimeout(function(){el.classList.remove('show');},3000);
}

// ── 封存期別切換（2026-07-11）──
// period-info 內同時放文字（#period-text）與期別下拉（#period-select）；
// 寫字一律走 setPeriodText，不可用 textContent 直寫（會把下拉轟掉）
function setPeriodText(t) {
  var info = document.getElementById('period-info');
  if (!info) return;
  var span = document.getElementById('period-text');
  if (!span) {
    span = document.createElement('span');
    span.id = 'period-text';
    info.insertBefore(span, info.firstChild);
  }
  Array.prototype.slice.call(info.childNodes).forEach(function(n){ if (n.nodeType === 3) info.removeChild(n); });
  span.textContent = t;
}
function initPeriodSelector() {
  fetchJsonWithTimeout(PERIODS_URL+'?t='+Date.now(), REALTIME_DATA_FETCH_TIMEOUT_MS).then(function(j){
    var periods = (j && j.periods) || [];
    if (!periods.length) return;
    var info = document.getElementById('period-info');
    if (!info || document.getElementById('period-select')) return;
    var sel = document.createElement('select');
    sel.id = 'period-select';
    sel.style.cssText = 'margin-left:8px;background:#161b22;color:#58a6ff;border:1px solid #30363d;border-radius:6px;padding:2px 6px;font-size:12px;cursor:pointer;';
    var optNow = document.createElement('option');
    optNow.value = ''; optNow.textContent = '本期';
    sel.appendChild(optNow);
    periods.forEach(function(p){
      var o = document.createElement('option');
      o.value = p; o.textContent = p + '（封存）';
      sel.appendChild(o);
    });
    sel.addEventListener('change', function(){
      VIEW_PERIOD = sel.value;
      if (!VIEW_PERIOD) { loadData(); return; }
      var fname = ARCHIVE_BASE + VIEW_PERIOD.replace('/','') + '.json';
      fetchJsonWithTimeout(fname+'?t='+Date.now(), REALTIME_DATA_FETCH_TIMEOUT_MS).then(function(j2){
        DATA = j2;
        setPeriodText('營收期間：'+(j2.period||VIEW_PERIOD)+'（封存）| 已申報 '+(j2.total_filed||0)+' 家 ');
        applyFilter();
        updateRevLastTime(j2);
      }).catch(function(){
        setPeriodText('封存資料載入失敗 ');
      });
    });
    info.appendChild(sel);
  }).catch(function(){});
}

loadData();
initPeriodSelector();

// ⓘ tooltip（JS fixed 定位，手機也能看）
(function() {
  var tipEl = document.createElement('div');
  Object.assign(tipEl.style, {
    position:'fixed', background:'#333', color:'#fff', padding:'8px 12px',
    borderRadius:'6px', fontSize:'12px', zIndex:'9999',
    pointerEvents:'none', display:'none', maxWidth:'min(90vw, 400px)', lineHeight:'1.6',
    whiteSpace:'pre-line'
  });
  document.body.appendChild(tipEl);
  function positionTip(el) {
    tipEl.textContent = el.getAttribute('data-tip');
    tipEl.style.display = 'block';
    var r = el.getBoundingClientRect();
    var left = r.left + r.width/2 - tipEl.offsetWidth/2;
    if (left < 4) left = 4;
    if (left + tipEl.offsetWidth > window.innerWidth - 4) left = window.innerWidth - tipEl.offsetWidth - 4;
    tipEl.style.left = left + 'px';
    // 上方空間不夠 → 往下彈
    var topPos = r.top - tipEl.offsetHeight - 6;
    if (topPos < 4) topPos = r.bottom + 6;
    // 下方也超出 → 限制最大高度並固定在頂部
    if (topPos + tipEl.offsetHeight > window.innerHeight - 4) {
      topPos = 4;
      tipEl.style.maxHeight = (window.innerHeight - 8) + 'px';
      tipEl.style.overflowY = 'auto';
    } else {
      tipEl.style.maxHeight = '';
      tipEl.style.overflowY = '';
    }
    tipEl.style.top = topPos + 'px';
  }
  document.addEventListener('mouseenter', function(e) {
    var el = e.target.closest ? e.target.closest('.info-i[data-tip]') : null;
    if (!el) return;
    positionTip(el);
  }, true);
  document.addEventListener('mouseleave', function(e) {
    if (e.target.closest && e.target.closest('.info-i[data-tip]')) tipEl.style.display = 'none';
  }, true);
  // 手機 touch 支援
  document.addEventListener('touchstart', function(e) {
    var el = e.target.closest ? e.target.closest('.info-i[data-tip]') : null;
    if (!el) { tipEl.style.display = 'none'; return; }
    positionTip(el);
  }, true);
})();
</script>
