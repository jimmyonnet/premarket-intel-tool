name: Build premarket page

# Runs once each weekday morning before market prep. 07:35 Taipei time ==
# 23:35 UTC the PREVIOUS UTC calendar day (Taipei is UTC+8), so the UTC
# weekday is shifted back by one vs. the Taipei weekday this fires for:
#   UTC Sun 23:35 -> Taipei Mon 07:35
#   UTC Mon 23:35 -> Taipei Tue 07:35
#   UTC Tue 23:35 -> Taipei Wed 07:35
#   UTC Wed 23:35 -> Taipei Thu 07:35
#   UTC Thu 23:35 -> Taipei Fri 07:35
# Taiwan market holidays are NOT accounted for (see README) -- on a holiday
# this will still run and publish a page nobody needed; harmless.
on:
  schedule:
    - cron: "35 23 * * 0-4"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Figure out today's date (Asia/Taipei)
        id: date
        run: echo "today=$(TZ=Asia/Taipei date +%F)" >> "$GITHUB_OUTPUT"

      - name: Fetch Part 1 -- indices
        run: python scripts/fetch_indices.py > data/latest/indices.json

      - name: Assemble Part 1 -- TX night session series
        run: |
          python scripts/tx_night_session.py assemble \
            --data-dir data/night_session \
            --date "${{ steps.date.outputs.today }}" \
            > data/latest/night_session.json

      - name: Fetch Part 2 -- disposal forecast
        # --skip-date-check: if chengwaye.com's date context looks wrong we
        # still want *a* page this morning -- build_page.py surfaces the
        # mismatch as a visible warning banner instead of us publishing
        # nothing. See README "About the date-check" section.
        run: |
          python scripts/fetch_disposal.py --skip-date-check \
            > data/latest/disposal.json

      - name: Build page
        run: |
          python scripts/build_page.py \
            --indices data/latest/indices.json \
            --night-session data/latest/night_session.json \
            --disposal data/latest/disposal.json \
            --out docs/index.html

      - name: Commit page + raw data snapshot
        run: |
          git config user.name "premarket-intel-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/index.html data/latest/
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "build premarket page for ${{ steps.date.outputs.today }}"
          git push
