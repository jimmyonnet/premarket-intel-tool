name: Verify opening result

on:
  # 09:05 / 09:10 / 09:15 Asia/Taipei = 01:05 / 01:10 / 01:15 UTC.
  schedule:
    - cron: "5 1 * * 1-5"
    - cron: "10 1 * * 1-5"
    - cron: "15 1 * * 1-5"
  workflow_dispatch:
    inputs:
      market_date:
        description: "Optional Taipei market date (YYYY-MM-DD)"
        required: false
        default: ""
      attempted_at:
        description: "Optional ISO timestamp for controlled testing"
        required: false
        default: ""
      final:
        description: "Mark unavailable opening as final unverified"
        required: false
        default: false
        type: boolean

concurrency:
  group: opening-forecast-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Resolve Taipei market date and attempt time
        id: clock
        env:
          INPUT_MARKET_DATE: ${{ inputs.market_date }}
          INPUT_ATTEMPTED_AT: ${{ inputs.attempted_at }}
        run: |
          market_date="${INPUT_MARKET_DATE}"
          [ -n "$market_date" ] || market_date="$(TZ=Asia/Taipei date +%F)"
          attempted_at="${INPUT_ATTEMPTED_AT}"
          [ -n "$attempted_at" ] || attempted_at="$(TZ=Asia/Taipei date --iso-8601=seconds)"
          echo "market_date=${market_date}" >> "$GITHUB_OUTPUT"
          echo "attempted_at=${attempted_at}" >> "$GITHUB_OUTPUT"
          echo "Verification target: ${market_date}; attempt: ${attempted_at}"

      - name: Check for today's locked forecast
        id: forecast_check
        run: |
          if [ ! -s data/latest/opening_forecast.json ]; then
            echo "has_forecast=false" >> "$GITHUB_OUTPUT"
            echo "No opening forecast artifact; safely skipping verification."
            exit 0
          fi
          if grep -q '"market_date": "${{ steps.clock.outputs.market_date }}"' data/latest/opening_forecast.json && grep -q '"status": "generated"' data/latest/opening_forecast.json; then
            echo "has_forecast=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_forecast=false" >> "$GITHUB_OUTPUT"
            echo "Forecast is not a generated forecast for today's target; refusing stale or incomplete verification."
          fi

      - name: Verify official first opening value
        if: steps.forecast_check.outputs.has_forecast == 'true'
        env:
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_FINAL: ${{ inputs.final }}
        run: |
          final="false"
          if [ "$SCHEDULE" = "15 1 * * 1-5" ] || [ "$INPUT_FINAL" = "true" ]; then final="true"; fi
          args=(
            --forecast data/latest/opening_forecast.json
            --out data/latest/opening_result.json
            --attempted-at "${{ steps.clock.outputs.attempted_at }}"
          )
          if [ "$final" = "true" ]; then args+=(--final); fi
          python scripts/opening_prediction/verify_opening.py "${args[@]}"

      - name: Record verified or final unverified day
        if: steps.forecast_check.outputs.has_forecast == 'true'
        run: |
          if grep -q '"status": "generated"' data/latest/opening_forecast.json; then
            python scripts/learning/record_opening.py \
              --forecast data/latest/opening_forecast.json \
              --result data/latest/opening_result.json \
              --directory data/opening_history
          else
            echo "Market is closed or forecast is not generated; no learning ledger row."
          fi

      - name: Rebuild learning status and public page
        if: steps.forecast_check.outputs.has_forecast == 'true'
        run: |
          python scripts/learning/build_status.py \
            --directory data/opening_history \
            --model-version opening-v1 \
            --out data/latest/learning_status.json
          python scripts/build_page.py \
            --indices data/latest/indices.json \
            --night-session data/latest/night_session.json \
            --disposal data/latest/disposal.json \
            --pressplay data/latest/pressplay.json \
            --chengwaye-daily data/latest/chengwaye_daily.json \
            --stock-history data/latest/stock_history.json \
            --calendar data/latest/calendar.json \
            --financials data/latest/financials.json \
            --news data/latest/news.json \
            --ai-summary data/latest/ai_summary.json \
            --twse-summary data/latest/twse_summary.json \
            --opening-forecast data/latest/opening_forecast.json \
            --opening-result data/latest/opening_result.json \
            --learning-status data/latest/learning_status.json \
            --source-status data/latest/source_status.json \
            --out docs/index.html
          python scripts/validate_data.py --data-dir data/latest

      - name: Commit and push opening result snapshot
        if: steps.forecast_check.outputs.has_forecast == 'true'
        run: |
          git config user.name "premarket-intel-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/latest/opening_result.json data/latest/learning_status.json docs/index.html docs/data docs/data_meta.json docs/sw.js
          if [ -d data/opening_history ]; then git add data/opening_history; fi
          git diff --cached --quiet && echo "no opening result changes" && exit 0
          git commit -m "verify opening result for ${{ steps.clock.outputs.market_date }} [skip ci]"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push; then
              exit 0
            fi
            git rebase --abort || true
            echo "opening result push attempt ${attempt} failed; retrying" >&2
            sleep $((attempt * 5))
          done
          echo "Unable to push opening result after 3 attempts" >&2
          exit 1
