name: Build premarket page

# Runs on schedule before Taiwan stock market open:
#   07:35 Taipei (UTC 23:35 previous day) - Full premarket fetch & build
#   08:05 Taipei (UTC 00:05 current day) - Asian markets (Nikkei/Kospi) initial open refresh
#   08:20 Taipei (UTC 00:20 current day) - Asian markets opening stabilization refresh
on:
  schedule:
    - cron: "35 23 * * 0-4"
    - cron: "5 0 * * 1-5"
    - cron: "20 0 * * 1-5"
  workflow_dispatch:
    inputs:
      data_date:
        description: 'Override data date (e.g. 08/24)'
        required: false
        default: ''
      force_build:
        description: 'Force build even if market holiday'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest tests/ -v

      - name: Install Playwright's Chromium (needed for Part 3's PressPlay login)
        run: playwright install --with-deps chromium

      - name: Figure out today's date (Asia/Taipei)
        id: date
        run: echo "today=$(TZ=Asia/Taipei date +%F)" >> "$GITHUB_OUTPUT"

      - name: Check TWSE trading day
        id: trading_day
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && ([ "${{ inputs.force_build }}" = "true" ] || [ -n "${{ inputs.data_date }}" ]); then
            echo "is_trading_day=true" >> "$GITHUB_OUTPUT"
            echo "Manual force build enabled."
          else
            if python scripts/trading_calendar.py is-trading-day --date "${{ steps.date.outputs.today }}"; then
              echo "is_trading_day=true" >> "$GITHUB_OUTPUT"
              echo "Today (${{ steps.date.outputs.today }}) is a TWSE trading day."
            else
              echo "is_trading_day=false" >> "$GITHUB_OUTPUT"
              echo "Today (${{ steps.date.outputs.today }}) is NOT a TWSE trading day (weekend/holiday). Skipping fetch & build."
            fi
          fi

      - name: Fetch data sources and audit source health
        if: steps.trading_day.outputs.is_trading_day == 'true'
        env:
          PRESSPLAY_EMAIL: ${{ secrets.PRESSPLAY_EMAIL }}
          PRESSPLAY_PASSWORD: ${{ secrets.PRESSPLAY_PASSWORD }}
        run: |
          python scripts/run_fetchers.py --mode full --date "${{ steps.date.outputs.today }}" --allow-unsafe-exit

      - name: Validate fetched data contracts
        if: steps.trading_day.outputs.is_trading_day == 'true'
        run: python scripts/validate_data.py --data-dir data/latest

      - name: Minify frontend module
        run: npx --yes terser scripts/assets/app.js -c passes=3,unsafe=true -m --comments false -o docs/assets/app.js

      - name: Build page
        if: steps.trading_day.outputs.is_trading_day == 'true'
        run: |
          python scripts/build_page.py \
            --indices data/latest/indices.json \
            --night-session data/latest/night_session.json \
            --disposal data/latest/disposal.json \
            --pressplay data/latest/pressplay.json \
            --chengwaye-daily data/latest/chengwaye_daily.json \
            --calendar data/latest/calendar.json \
            --financials data/latest/financials.json \
            --news data/latest/news.json \
            --twse-summary data/latest/twse_summary.json \
            --source-status data/latest/source_status.json \
            --data-date "${{ inputs.data_date }}" \
            --out docs/index.html

      - name: Archive daily data to history
        if: steps.trading_day.outputs.is_trading_day == 'true'
        run: |
          python scripts/archive_history.py

      - name: Commit page, history + raw data snapshot
        if: steps.trading_day.outputs.is_trading_day == 'true'
        run: |
          git config user.name "premarket-intel-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/index.html docs/data_meta.json docs/data/ docs/assets/ docs/sw.js docs/embed/ data/latest/ history/
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "build premarket page for ${{ steps.date.outputs.today }}"
          git push

      - name: Send Premarket Summary Webhook
        if: success() && steps.trading_day.outputs.is_trading_day == 'true'
        env:
          LINE_NOTIFY_TOKEN: ${{ secrets.LINE_NOTIFY_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SUMMARY_WEBHOOK_URL: ${{ secrets.SUMMARY_WEBHOOK_URL }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: |
          python scripts/notify_summary.py --mode success || true

      - name: Send Failure Notification Webhook
        if: failure() && steps.trading_day.outputs.is_trading_day == 'true'
        env:
          LINE_NOTIFY_TOKEN: ${{ secrets.LINE_NOTIFY_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ERROR_WEBHOOK_URL: ${{ secrets.ERROR_WEBHOOK_URL }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: |
          python scripts/notify_summary.py --mode failure || true


