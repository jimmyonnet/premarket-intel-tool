name: Data freshness watchdog

# A failing workflow notifies; a workflow that quietly stops running does not.
# This checks the published package every trading day after the opening result
# should exist, so a stalled pipeline surfaces within a day instead of weeks.
# 09:30 Taipei == 01:30 UTC on the same UTC calendar day
on:
  schedule:
    - cron: "30 1 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  check:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: python -m pip install -r requirements.txt

      - name: Resolve Taipei date
        id: date
        run: echo "today=$(TZ=Asia/Taipei date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Check TWSE trading day
        id: trading_day
        run: |
          if python scripts/trading_calendar.py is-trading-day --date "${{ steps.date.outputs.today }}"; then
            echo "is_trading_day=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_trading_day=false" >> "$GITHUB_OUTPUT"
            echo "Today (${{ steps.date.outputs.today }}) is NOT a TWSE trading day. Skipping freshness check."
          fi

      - name: Check published artifact freshness
        if: steps.trading_day.outputs.is_trading_day == 'true'
        run: python scripts/check_freshness.py --market-date "${{ steps.date.outputs.today }}"

  notify-failure:
    needs: [check]
    if: >-
      always() &&
      (needs.check.result == 'failure' || needs.check.result == 'cancelled')
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Send Failure Notification Webhook
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ERROR_WEBHOOK_URL: ${{ secrets.ERROR_WEBHOOK_URL }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          FAILED_JOBS: check=${{ needs.check.result }}
        run: python scripts/notify_summary.py --mode failure
