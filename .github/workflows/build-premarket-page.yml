name: Build premarket page

# All scheduled times below are Taiwan time (UTC+8):
#   19:35 - Chengwaye disposal forecast (source publishes about 19:30)
#   21:00 / 23:00 - PressPlay premarket article & candidate stocks evening refresh
#   07:30 - Morning full premarket fetch & PressPlay final check
#   08:05 / 08:20 - Asian markets (Nikkei/Kospi) opening refresh
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "35 11 * * 1-5"
    - cron: "0 13 * * 0-4"
    - cron: "0 15 * * 0-4"
    - cron: "30 23 * * 0-4"
    - cron: "5 0 * * 1-5"
    - cron: "20 0 * * 1-5"
  workflow_dispatch:
    inputs:
      data_date:
        description: 'Override data date (e.g. 08/24)'
        required: false
        default: ''
      force_build:
        description: 'Force build even if market holiday'
        required: false
        default: false
        type: boolean
      pressplay_text:
        description: '貼上 PressPlay 文章全文 (可選，若自動登入被驗證碼阻擋時使用)'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel an in-flight data build; it may already have published a
  # consistent Pages snapshot and is protected by the push/rebase retry below.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # PRs and human pushes protect the repository with the full regression suite.
  # The generated bot commit is intentionally excluded to prevent an endless
  # workflow loop; it is validated by the originating build job before push.
  full-quality:
    timeout-minutes: 20
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.actor != 'premarket-intel-bot') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-1.62.0-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            playwright-${{ runner.os }}-1.62.0-

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Run full unit and contract tests
        run: python -m pytest tests/ -q

      - name: Install Playwright's Chromium for full checks
        run: playwright install --with-deps chromium

  build:
    needs: [full-quality]
    timeout-minutes: 20
    if: >-
      always() &&
      (needs.full-quality.result == 'success' || needs.full-quality.result == 'skipped') &&
      github.event_name != 'pull_request' && github.actor != 'premarket-intel-bot'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-1.62.0-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            playwright-${{ runner.os }}-1.62.0-

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      # Scheduled refreshes use the browser cache when available but do not
      # spend the scheduled job's budget installing a browser. High-risk
      # PressPlay fetches then fall back honestly if no cached browser exists.
      - name: Install Playwright's Chromium for human/manual data refresh
        if: github.event_name != 'schedule'
        run: playwright install --with-deps chromium

      - name: Figure out today's date (Asia/Taipei)
        id: date
        run: echo "today=$(TZ=Asia/Taipei date +%F)" >> "$GITHUB_OUTPUT"

      - name: Refresh authoritative TWSE trading calendar
        run: |
          year="${{ steps.date.outputs.today }}"
          year="${year%%-*}"
          python scripts/trading_calendar.py update --year "${year}"
          python scripts/trading_calendar.py validate --year "${year}"

      - name: Run scheduled smoke checks and data contract validation
        if: github.event_name == 'schedule'
        run: |
          python -m pytest -q tests/test_smoke_contract.py
          python scripts/validate_data.py --data-dir data/latest --normalize

      - name: Check TWSE trading day
        id: trading_day
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && ([ "${{ inputs.force_build }}" = "true" ] || [ -n "${{ inputs.data_date }}" ] || [ -n "${{ inputs.pressplay_text }}" ]); then
            echo "is_trading_day=true" >> "$GITHUB_OUTPUT"
            echo "Manual force build enabled."
          else
            if python scripts/trading_calendar.py is-trading-day --date "${{ steps.date.outputs.today }}"; then
              echo "is_trading_day=true" >> "$GITHUB_OUTPUT"
              echo "Today (${{ steps.date.outputs.today }}) is a TWSE trading day."
            else
              echo "is_trading_day=false" >> "$GITHUB_OUTPUT"
              echo "Today (${{ steps.date.outputs.today }}) is NOT a TWSE trading day (weekend/holiday). Skipping fetch & build."
            fi
          fi

      - name: Save manual PressPlay article text if provided
        if: steps.trading_day.outputs.is_trading_day == 'true' && inputs.pressplay_text != ''
        run: |
          mkdir -p data/pressplay
          cat << 'EOF' > "data/pressplay/${{ steps.date.outputs.today }}.md"
          ${{ inputs.pressplay_text }}
          EOF
          echo "PRESSPLAY_MANUAL_ARTICLE_PATH=data/pressplay/${{ steps.date.outputs.today }}.md" >> "$GITHUB_ENV"

      - name: Fetch data sources and audit source health
        if: steps.trading_day.outputs.is_trading_day == 'true'
        env:
          PRESSPLAY_EMAIL: ${{ secrets.PRESSPLAY_EMAIL }}
          PRESSPLAY_PASSWORD: ${{ secrets.PRESSPLAY_PASSWORD }}
        run: |
          mode="full"
          ttl_flag=""
          if [ "${{ github.event_name }}" = "schedule" ]; then
            ttl_flag="--respect-ttl"
            case "${{ github.event.schedule }}" in
              "35 11 * * 1-5") mode="disposal" ;;
              "0 13 * * 0-4"|"0 13 * * 1-5"|"0 15 * * 0-4"|"0 15 * * 1-5") mode="candidates" ;;
              "30 23 * * 0-4"|"35 23 * * 0-4") mode="morning-core" ;;
              "5 0 * * 1-5"|"20 0 * * 1-5") mode="asia-open-update" ;;
              *) echo "Unknown schedule: ${{ github.event.schedule }}" >&2; exit 1 ;;
            esac
          fi
          echo "Refreshing mode: ${mode} ${ttl_flag}"
          python scripts/run_fetchers.py --mode "${mode}" --date "${{ steps.date.outputs.today }}" --allow-unsafe-exit ${ttl_flag}

      # Optional repository secret: GEMINI_API_KEY. When absent, the script
      # publishes deterministic summaries and data-quality checks instead.
      - name: Generate optional Gemini AI briefing
        if: steps.trading_day.outputs.is_trading_day == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: python scripts/generate_ai_summary.py --out data/latest/ai_summary.json

      - name: Validate fetched data contracts
        if: steps.trading_day.outputs.is_trading_day == 'true'
        run: python scripts/validate_data.py --data-dir data/latest --normalize

      - name: Build page
        if: steps.trading_day.outputs.is_trading_day == 'true'
        run: |
          python scripts/build_page.py \
            --indices data/latest/indices.json \
            --night-session data/latest/night_session.json \
            --disposal data/latest/disposal.json \
            --pressplay data/latest/pressplay.json \
            --chengwaye-daily data/latest/chengwaye_daily.json \
            --stock-history data/latest/stock_history.json \
            --calendar data/latest/calendar.json \
            --financials data/latest/financials.json \
            --news data/latest/news.json \
            --ai-summary data/latest/ai_summary.json \
            --twse-summary data/latest/twse_summary.json \
            --source-status data/latest/source_status.json \
            --data-date "${{ inputs.data_date }}" \
            --out docs/index.html

      - name: Archive daily data to history
        if: steps.trading_day.outputs.is_trading_day == 'true'
        run: python scripts/archive_history.py --retain-days 60

      - name: Commit page, history, calendar + raw data snapshot
        if: steps.trading_day.outputs.is_trading_day == 'true'
        run: |
          git config user.name "premarket-intel-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "build premarket page for ${{ steps.date.outputs.today }}"
          # Fold any last-millisecond generated changes into the build commit
          # before rebasing, so pull never sees a dirty worktree. .gitignore
          # keeps Python caches out of both stages.
          git add -A
          git diff --cached --quiet || git commit --amend --no-edit
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push; then
              exit 0
            fi
            git rebase --abort || true
            git add -A
            git diff --cached --quiet || git commit --amend --no-edit
            echo "push attempt ${attempt} failed; retrying" >&2
            sleep $((attempt * 5))
          done
          echo "Unable to push generated build after 3 attempts" >&2
          exit 1

      - name: Send Premarket Summary Webhook
        if: success() && steps.trading_day.outputs.is_trading_day == 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SUMMARY_WEBHOOK_URL: ${{ secrets.SUMMARY_WEBHOOK_URL }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: python scripts/notify_summary.py --mode success


  notify-failure:
    needs: [full-quality, build]
    if: >-
      always() &&
      (needs.full-quality.result == 'failure' || needs.full-quality.result == 'cancelled' ||
       needs.build.result == 'failure' || needs.build.result == 'cancelled')
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Send Failure Notification Webhook
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ERROR_WEBHOOK_URL: ${{ secrets.ERROR_WEBHOOK_URL }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          FAILED_JOBS: full-quality=${{ needs.full-quality.result }},build=${{ needs.build.result }}
        run: python scripts/notify_summary.py --mode failure
