name: Collect TX night-session snapshot

# Runs every 30 minutes through the TAIFEX night session (盤後/夜盤).
# 15:00-05:00 Taipei time == 07:00-21:00 UTC on the SAME UTC calendar day
# (Taipei is UTC+8, so the whole overnight window never crosses a UTC
# midnight -- convenient, no day-rollover math needed here).
# Mon-Fri UTC covers all 5 prep-nights (Fri evening preps the following
# Monday's session). Taiwan market holidays are NOT accounted for -- a
# holiday-eve run will just collect data nobody reads; harmless.
on:
  schedule:
    - cron: "*/30 7-20 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Take one snapshot
        run: python scripts/tx_night_session.py collect --data-dir data/night_session

      - name: Commit snapshot
        run: |
          git config user.name "premarket-intel-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/night_session/
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "night session snapshot $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
